name: KAÏA Web CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: app
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out the application without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: app
          persist-credentials: false
      - name: Select the fixed Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
      - name: Verify private dependency setup guards offline
        run: node --test scripts/bootstrap-shared-packages.test.mjs scripts/install-private-dependencies.test.mjs
      - name: Read the immutable shared package revision
        id: shared
        run: node scripts/bootstrap-shared-packages.mjs --github-output
      - name: Check required private read credentials
        env:
          PACKAGE_SOURCE_KEY_PRESENT: ${{ secrets.PURAMA_PACKAGES_READ_SSH_KEY != '' }}
          SMARANA_KEY_PRESENT: ${{ secrets.SMARANA_READ_SSH_KEY != '' }}
        run: |
          if [ "$PACKAGE_SOURCE_KEY_PRESENT" != true ]; then
            echo '::error::A dedicated read-only PURAMA_PACKAGES_READ_SSH_KEY is required for purama-master.'
            exit 1
          fi
          if [ "$SMARANA_KEY_PRESENT" != true ]; then
            echo '::error::A separate read-only SMARANA_READ_SSH_KEY is required for purama-smarana.'
            exit 1
          fi
      - name: Retrieve only manifest-listed private source files
        env:
          PURAMA_PACKAGES_READ_SSH_KEY: ${{ secrets.PURAMA_PACKAGES_READ_SSH_KEY }}
          TMPDIR: ${{ runner.temp }}/kaia-shared-source-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir -m 700 -- "$TMPDIR"
          node scripts/install-private-dependencies.mjs --shared-source "$GITHUB_WORKSPACE/shared-source"
      - name: Remove and verify temporary source authentication
        if: always()
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { spawnSync } = require('node:child_process');
          const root = fs.realpathSync(process.env.RUNNER_TEMP);
          if (!/^\d+$/.test(process.env.GITHUB_RUN_ID) || !/^\d+$/.test(process.env.GITHUB_RUN_ATTEMPT)) throw new Error('Invalid owned cleanup identity.');
          const directory = path.join(root, `kaia-shared-source-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}`);
          fs.rmSync(directory, { recursive: true, force: true });
          try {
            fs.lstatSync(directory);
            throw new Error('Temporary shared source authentication remains.');
          } catch (error) { if (error.code !== 'ENOENT') throw error; }
          const env = { ...process.env };
          for (const key of Object.keys(env)) if (key.startsWith('GIT_')) delete env[key];
          Object.assign(env, { GIT_CONFIG_NOSYSTEM: '1', GIT_CONFIG_GLOBAL: '/dev/null' });
          const result = spawnSync('git', ['-C', path.join(process.env.GITHUB_WORKSPACE, 'app'), 'config', '--local',
            '--no-includes', '--name-only', '--get-regexp',
            '^(core\\.sshcommand|http\\..*\\.extraheader|credential\\..*|url\\..*\\.insteadof|include\\.path|includeif\\..*\\.path)$'],
            { env, encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'], timeout: 5000, maxBuffer: 65536 });
          if (result.error || result.status !== 1 || result.stdout.trim()) throw new Error('Persistent checkout authentication remains or cannot be verified.');
          console.log(JSON.stringify({ sharedSourceTemporaryDirectoryAbsent: true, checkoutAuthenticationConfigAbsent: true }));
          NODE
      - name: Verify every source digest and create the sibling package layout
        run: node scripts/bootstrap-shared-packages.mjs "$GITHUB_WORKSPACE/shared-source" "$GITHUB_WORKSPACE/packages"
      - name: Install the locked dependencies with repository-scoped credentials
        env:
          SMARANA_READ_SSH_KEY: ${{ secrets.SMARANA_READ_SSH_KEY }}
          TMPDIR: ${{ runner.temp }}/kaia-private-install-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir -m 700 -- "$TMPDIR"
          node scripts/install-private-dependencies.mjs
          git diff --exit-code -- package.json package-lock.json tooling/shared-packages.lock.json
      - name: Remove temporary private installation authentication
        if: always()
        run: |
          auth_dir="$RUNNER_TEMP/kaia-private-install-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          rm -rf -- "$auth_dir"
          test ! -e "$auth_dir" && test ! -L "$auth_dir"
      - name: Run dependency lifecycle scripts without repository credentials
        run: |
          npm rebuild --no-audit --no-fund
          git diff --exit-code -- package.json package-lock.json
      - name: Run the standard application regression suite
        run: npm test -- --maxWorkers=2 --minWorkers=1
      - name: Generate route types and check the complete application TypeScript
        run: |
          node node_modules/next/dist/bin/next typegen
          node node_modules/typescript/bin/tsc --noEmit --incremental false
      - name: Lint all Web application sources with the real shared configuration
        run: npm run lint -- --max-warnings=168
      - name: Build Next with synthetic provider configuration
        env:
          # Inert loopback and synthetic values are limited to this build step.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:1
          NEXT_PUBLIC_SUPABASE_ANON_KEY: kaia-build-fixture-anon-not-a-credential
          SUPABASE_SERVICE_ROLE_KEY: kaia-build-fixture-role-not-a-credential
          RESEND_API_KEY: re_kaia_build_fixture_only
          STRIPE_SECRET_KEY: sk_test_kaia_build_fixture_only
          ANTHROPIC_API_KEY: kaia-build-fixture-only-not-a-credential
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:1
        run: npm run build
